<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #231f20;
    }
    body {
      display: grid;
      place-items: center;
    }
    #unity-frame {
      position: relative;
      width: min(100vw, 177.77778vh, 1920px);
      aspect-ratio: 16 / 9;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #231f20;
    }
    #unity-loading, #unity-error {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font: 16px Arial, sans-serif;
      pointer-events: none;
    }
    #unity-error { display: none; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="unity-frame">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    <div id="unity-loading">Loading…</div>
    <div id="unity-error"></div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('unity-loading');
    const error = document.getElementById('unity-error');
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: false
    }).then(() => {
      loading.style.display = 'none';
    }).catch((message) => {
      loading.style.display = 'none';
      error.textContent = String(message);
      error.style.display = 'grid';
    });
  </script>
</body>
</html>
